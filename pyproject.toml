[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utmkit"
version = "0.1.0"
description = "Batch UTM campaign links with consistent slugs, validation, QR codes and a static index page"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "calasdan-sketch" }]
keywords = ["utm", "campaign", "tracking", "qr", "marketing", "csv", "links"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
utmkit = "utmkit.cli:main"

[project.optional-dependencies]
qr = ["qrcode>=7"]

[tool.setuptools.packages.find]
where = ["src"]
