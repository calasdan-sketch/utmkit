[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "utmkit"
version = "0.2.0"
description = "Batch UTM campaign links with consistent slugs, validation, QR codes and a static index page"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Calas Automations Inc." }]
maintainers = [{ name = "Calas Automations Inc." }]
license-files = ["LICENSE"]
keywords = ["utm", "campaign", "tracking", "qr", "marketing", "csv", "links", "ga4", "google-analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
utmkit = "utmkit.cli:main"

[project.optional-dependencies]
qr = ["qrcode>=7"]
dev = ["pytest", "hypothesis", "build", "twine"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
utmkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
